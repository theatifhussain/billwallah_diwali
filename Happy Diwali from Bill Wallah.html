<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1730">
<title>Happy Diwali from Bill Wallah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#113766;--night:#0a1730;--ink:#050b1a;--gold:#ffc83d;--saffron:#ff8a1f;--rose:#ff3d7f;--cream:#fff4d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 80% at 50% 110%,#2a1450 0%,var(--night) 45%,var(--ink) 100%);color:var(--cream);font-family:"Nunito",system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#stars{z-index:0}#fx{z-index:2;pointer-events:none}
.stage{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 20px 22px;text-align:center}
.brand{font-family:"Outfit",sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;color:#fff}
.brand img{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--gold);box-shadow:0 0 18px rgba(255,200,61,.35);display:block}
.glogo{width:120px;height:120px;border-radius:28px;border:2px solid var(--gold);box-shadow:0 0 50px 8px rgba(255,200,61,.3)}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.hello{font-family:"Outfit",sans-serif;font-weight:600;font-size:clamp(16px,4.6vw,20px);color:var(--gold);opacity:0;transform:translateY(8px)}
h1{margin:0;font-family:"Outfit",sans-serif;font-weight:900;line-height:.92;font-size:clamp(58px,19vw,92px);letter-spacing:-.03em;background:linear-gradient(180deg,#fff7d9 0%,var(--gold) 45%,var(--saffron) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 26px rgba(255,138,31,.45));opacity:0;transform:scale(.7)}
.sub{margin:10px 0 0;max-width:30ch;font-size:clamp(15px,4.2vw,17px);line-height:1.45;color:#ffe9b8;opacity:0}
.live .hello{animation:in .7s .1s forwards}.live h1{animation:pop .9s .25s cubic-bezier(.2,1.6,.4,1) forwards}.live .sub{animation:in .8s .8s forwards}
@keyframes in{to{opacity:1;transform:none}}@keyframes pop{to{opacity:1;transform:none}}
.diya{position:relative;width:150px;height:96px;margin:4px 0}
.diya .bowl{position:absolute;bottom:0;left:50%;width:128px;height:46px;margin-left:-64px;border-radius:6px 6px 64px 64px/6px 6px 46px 46px;background:linear-gradient(180deg,#ffb347,#d9631a 60%,#8a3410);box-shadow:0 0 40px 6px rgba(255,138,31,.35)}
.diya .bowl::after{content:"";position:absolute;left:14px;right:14px;top:7px;height:8px;border-radius:50%;background:#5a1e08}
.flame{position:absolute;left:50%;bottom:42px;width:30px;height:58px;margin-left:-15px;background:radial-gradient(50% 60% at 50% 70%,#fff8d0 0%,var(--gold) 45%,var(--saffron) 80%,transparent 100%);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;transform-origin:50% 100%;animation:flick 1.2s ease-in-out infinite;filter:blur(.4px);box-shadow:0 0 50px 18px rgba(255,170,40,.55)}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1.5deg)}30%{transform:scale(.94,1.08) rotate(2deg)}60%{transform:scale(1.04,.95) rotate(-2deg)}}
.hint{font-size:13px;color:#b9c6e6;margin:0 0 12px;opacity:0}.live .hint{animation:in 1s 1.6s forwards}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px}
button{font:inherit;font-family:"Outfit",sans-serif;font-weight:800;font-size:16px;border:0;border-radius:16px;padding:15px 10px;color:#2a0f00;cursor:pointer;min-height:54px;transition:transform .12s}
button:active{transform:scale(.95)}button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.b1{background:linear-gradient(180deg,var(--gold),var(--saffron))}
.b2{background:linear-gradient(180deg,#ff7aa8,var(--rose));color:#fff}
.b3{grid-column:1/-1;background:#25d366;color:#04230f;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:16px;padding:15px 10px;min-height:54px;font-family:"Outfit",sans-serif;font-weight:800;font-size:16px}
.b3:active{transform:scale(.97)}
.foot{margin-top:12px;font-size:12px;color:#8fa0c8}
#gate{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;background:radial-gradient(100% 70% at 50% 100%,#2a1450,var(--ink));transition:opacity .6s,visibility .6s}
#gate.out{opacity:0;visibility:hidden}
#gate p{margin:0;font-family:"Outfit",sans-serif;font-weight:600;font-size:18px;color:var(--cream)}
#gate .go{font-size:19px;padding:17px 30px;border-radius:999px;background:linear-gradient(180deg,var(--gold),var(--saffron));box-shadow:0 0 0 0 rgba(255,200,61,.6);animation:ring 1.8s infinite}
@keyframes ring{70%{box-shadow:0 0 0 22px rgba(255,200,61,0)}100%{box-shadow:0 0 0 0 rgba(255,200,61,0)}}
.shake{animation:shake .45s}@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(2px,3px)}}
@media (max-height:640px){.glogo{width:84px;height:84px;border-radius:20px}.diya{transform:scale(.75);margin:-10px 0}.sub{display:none}}
@media (prefers-reduced-motion:reduce){.flame,#gate .go{animation:none}.shake{animation:none}}
</style>
</head>

<script>
(function(){
var fx=document.getElementById('fx'),c=fx.getContext('2d'),st=document.getElementById('stars'),sc=st.getContext('2d');
var W,H,DPR=Math.min(window.devicePixelRatio||1,2),calm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var stars=[];
function size(){W=innerWidth;H=innerHeight;[fx,st].forEach(function(k){k.width=W*DPR;k.height=H*DPR});c.setTransform(DPR,0,0,DPR,0,0);sc.setTransform(DPR,0,0,DPR,0,0);
stars=[];for(var i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.8,r:Math.random()*1.3+.3,p:Math.random()*6})}
addEventListener('resize',size);size();
function drawStars(t){sc.clearRect(0,0,W,H);stars.forEach(function(s){sc.globalAlpha=.35+.5*Math.abs(Math.sin(t/900+s.p));sc.fillStyle='#fff';sc.beginPath();sc.arc(s.x,s.y,s.r,0,6.3);sc.fill()});sc.globalAlpha=1}

/* ---------- sound (WebAudio, synthesized) ---------- */
var A=null,master=null,nbuf=null;
function audio(){if(A)return A;try{A=new (window.AudioContext||window.webkitAudioContext)();master=A.createGain();master.gain.value=.9;master.connect(A.destination);
var n=A.sampleRate*1.2,b=A.createBuffer(1,n,A.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;nbuf=b}catch(e){A=null}return A}
function noise(t,dur,type,freq,vol,q){var s=A.createBufferSource();s.buffer=nbuf;var f=A.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q||.7;var g=A.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.2);s.stop(t+dur+.05)}
function pop(v){if(!audio())return;var t=A.currentTime;v=v||1;noise(t,.09,'highpass',1800,1.1*v,1);noise(t,.18,'bandpass',900+Math.random()*600,.7*v,1.4);
var o=A.createOscillator(),g=A.createGain();o.type='triangle';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(70,t+.12);g.gain.setValueAtTime(.7*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(master);o.start(t);o.stop(t+.16)}
function boom(v){if(!audio())return;var t=A.currentTime;v=v||1;noise(t,.9,'lowpass',420,1.6*v,.8);noise(t,.12,'highpass',1200,.9*v);
var o=A.createOscillator(),g=A.createGain();o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(34,t+.6);g.gain.setValueAtTime(1.2*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);o.connect(g);g.connect(master);o.start(t);o.stop(t+.75)}
function whistle(dur){if(!audio())return;var t=A.currentTime,o=A.createOscillator(),g=A.createGain();o.type='sine';o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(2200,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.12,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
function crackle(n){for(var i=0;i<n;i++)setTimeout(function(){if(A){noise(A.currentTime,.04,'highpass',2500,.5,1)}},i*(40+Math.random()*60))}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ---------- particles ---------- */
var parts=[],rockets=[],conf=[];
var PAL=[['#ffc83d','#ff8a1f','#fff4d6'],['#ff3d7f','#ff9ec0','#fff'],['#3dd6ff','#8aa8ff','#fff'],['#7dff6b','#ffe94d','#fff'],['#c07bff','#ff7bd5','#fff']];
function burst(x,y,big){
  var pal=PAL[Math.floor(Math.random()*PAL.length)],n=(calm?30:big?120:80),ring=Math.random()<.35;
  for(var i=0;i<n;i++){var a=Math.PI*2*i/n+Math.random()*.1,sp=ring?(big?5:3.6):(Math.random()*(big?7:5)+1.5);
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,dec:.008+Math.random()*.01,col:pal[i%3],r:Math.random()*1.6+1,tw:Math.random()<.3})}
  boom(big?1.1:.8);setTimeout(function(){crackle(calm?3:8)},120);buzz(big?[30,20,40]:25);
}
function rocket(tx,ty,fromX){var x=fromX==null?W*(.2+Math.random()*.6):fromX;rockets.push({x:x,y:H,tx:tx,ty:ty,sp:11+Math.random()*3,t:0});whistle(.6)}
function sky(){return H*(.12+Math.random()*.38)}
function popper(side){
  pop(1);setTimeout(function(){pop(.8)},90);boom(.7);buzz([40,30,60]);
  var ox=side?W:0,oy=H*.82,n=calm?30:110,cols=['#ffc83d','#ff3d7f','#3dd6ff','#7dff6b','#fff','#c07bff','#ff8a1f'];
  for(var i=0;i<n;i++){var a=(side?Math.PI:0)-(.3+Math.random()*1.1)*(side?-1:1)*-1;
    a=side?Math.PI+.25+Math.random()*1.0:-.25-Math.random()*1.0;a=side?Math.PI-(.25+Math.random()*1.0):-(.25+Math.random()*1.0);
    var sp=Math.random()*14+6;conf.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:Math.random()*8+5,h:Math.random()*5+3,rot:Math.random()*6,vr:(Math.random()-.5)*.4,col:cols[i%cols.length],life:1})}
}
function partyBoom(){popper(0);setTimeout(function(){popper(1)},140);
  document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');
  for(var i=0;i<4;i++)(function(i){setTimeout(function(){burst(W*(.15+Math.random()*.7),sky(),true)},200+i*220)})(i)}

function frame(t){
  drawStars(t);
  c.globalCompositeOperation='destination-out';c.fillStyle='rgba(0,0,0,.22)';c.fillRect(0,0,W,H);
  c.globalCompositeOperation='lighter';
  for(var i=rockets.length-1;i>=0;i--){var r=rockets[i],dx=r.tx-r.x,dy=r.ty-r.y,d=Math.hypot(dx,dy);
    if(d<r.sp+2){burst(r.tx,r.ty,Math.random()<.4);rockets.splice(i,1);continue}
    r.x+=dx/d*r.sp;r.y+=dy/d*r.sp;c.fillStyle='#ffe9b0';c.beginPath();c.arc(r.x,r.y,2.2,0,6.3);c.fill();
    c.fillStyle='rgba(255,170,60,.5)';c.beginPath();c.arc(r.x-dx/d*6,r.y-dy/d*6,1.6,0,6.3);c.fill()}
  for(var j=parts.length-1;j>=0;j--){var p=parts[j];p.vx*=.97;p.vy=p.vy*.97+.07;p.x+=p.vx;p.y+=p.vy;p.life-=p.dec;
    if(p.life<=0){parts.splice(j,1);continue}
    c.globalAlpha=p.tw&&Math.random()<.4?.2:p.life;c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.r*(.5+p.life*.6),0,6.3);c.fill()}
  c.globalAlpha=1;c.globalCompositeOperation='source-over';
  for(var k=conf.length-1;k>=0;k--){var q=conf[k];q.vx*=.985;q.vy=q.vy*.985+.28;q.x+=q.vx+Math.sin(q.rot)*.6;q.y+=q.vy;q.rot+=q.vr;q.life-=.006;
    if(q.life<=0||q.y>H+20){conf.splice(k,1);continue}
    c.save();c.translate(q.x,q.y);c.rotate(q.rot);c.globalAlpha=Math.min(1,q.life*2);c.fillStyle=q.col;c.fillRect(-q.w/2,-q.h/2*Math.abs(Math.cos(q.rot*2)),q.w,q.h*Math.abs(Math.cos(q.rot*2))+1);c.restore()}
  c.globalAlpha=1;
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
